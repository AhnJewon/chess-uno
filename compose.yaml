services:
  chess-uno:
    build: .
    container_name: chess-uno
    restart: unless-stopped
    ports:
      - "3210:3000"
    volumes:
      - chess-uno-data:/app/data
    networks:
      - default
      - npm_proxy

volumes:
  chess-uno-data:

networks:
  npm_proxy:
    external: true
    name: nginx-proxy-manager_default
